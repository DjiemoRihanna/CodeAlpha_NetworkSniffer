name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax compiles
        run: python -m py_compile sniffer.py

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check sniffer.py --select E9,F,E4,E7
